# ──────────────────────────────────────────────────────────────────────────────
# ORSD — Standalone Deployment
# ──────────────────────────────────────────────────────────────────────────────
# Spins up Dgraph + the API server. Crawler runs on-demand or via cron.
#
# Usage:
#   docker compose up -d              # start Dgraph + API
#   docker compose run --rm crawler   # run a crawl on-demand
#
# Host networking note: every service uses network_mode: host on purpose. This
# deploy target (an OpenVZ VPS) cannot reliably program iptables rules for
# docker-published ports ("iptables: Memory allocation problem" whenever the
# nat/raw rules for a new port are inserted — the VE's netfilter allocation is
# saturated by the many stacks already running). Host networking needs no
# published ports at all, so there is nothing for netfilter to do. The apps
# bind loopback directly:
#   - api              127.0.0.1:3003  (Traefik service 'orsd' dials this)
#   - dgraph http      127.0.0.1:18085
#   - dgraph grpc      127.0.0.1:19080  (host :9080 belongs to promtail)
#   - dgraph internal  127.0.0.1:7080  (zero/alpha internals on 5080/6080)
# The crawler/discover also run on host networking and use the same URLs.
# ──────────────────────────────────────────────────────────────────────────────

services:
  dgraph:
    image: dgraph/standalone:v24.0.0
    network_mode: host
    # The image's /run.sh runs dgraph zero & dgraph alpha unchanged. We emulate
    # that here so the alpha http/grpc ports leave :8080 and :9080 alone
    # (promtail owns :9080; :8080 is contested on this host).
    command: ["/bin/sh", "-c", "dgraph zero & exec dgraph alpha --http_port=18085 --grpc_port=19080"]
    environment:
      DGRAPH_ALPHA_SECURITY: "whitelist=0.0.0.0/0"
    volumes:
      - dgraph_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18085/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    network_mode: host
    restart: unless-stopped
    environment:
      DGRAPH_URL: http://127.0.0.1:18085
      PORT: "3003"
    depends_on:
      dgraph:
        condition: service_healthy
    healthcheck:
      # node:22-alpine has no curl; node 22 ships global fetch and busybox wget
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  crawler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.crawler
    network_mode: host
    environment:
      DGRAPH_URL: http://127.0.0.1:18085
    depends_on:
      dgraph:
        condition: service_healthy
    profiles:
      - crawl

  discover:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.crawler
    command: ["node", "dist/sources/eu-legislation/discover.js"]
    network_mode: host
    environment:
      DGRAPH_URL: http://127.0.0.1:18085
    volumes:
      - discover_data:/app/data
    depends_on:
      dgraph:
        condition: service_healthy
    profiles:
      - discover

volumes:
  dgraph_data:
  discover_data: