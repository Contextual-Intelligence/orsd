# ──────────────────────────────────────────────────────────────────────────────
# ORSD Crawl — runs all source connectors (manual only)
# ──────────────────────────────────────────────────────────────────────────────
# The scheduled crawl now runs on the deployment host itself
# (/etc/cron.d/orsd-crawl, 02:00 UTC) against dgraph over loopback. The stack
# is host-networked, so a GitHub-hosted runner would have to reach dgraph's
# unauthenticated HTTP API over the public internet — GitHub-hosted runners
# have no small, stable IPv4 range to allow-list. This workflow is kept for
# ad-hoc/manual crawls only; point DGRAPH_URL at a reachable dgraph.

name: Crawl (manual)

on:
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run crawl
        run: npm run crawl
        env:
          DGRAPH_URL: ${{ secrets.ORSD_DGRAPH_URL }}
      - name: Report results
        if: always()
        run: |
          echo "Nightly crawl complete. Check the crawl logs above for details."
