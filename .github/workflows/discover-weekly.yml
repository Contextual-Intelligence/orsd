# ──────────────────────────────────────────────────────────────────────────────
# ORSD Weekly EUR-Lex Discovery — scans for new EU legislative acts
# ──────────────────────────────────────────────────────────────────────────────
# Runs the automated discovery module every Monday at 03:00 UTC.
# Discovers new CELEX IDs, scores relevance, and creates a GitHub issue
# for human-in-loop review when candidates are found.
# ──────────────────────────────────────────────────────────────────────────────

name: Weekly EUR-Lex Discovery

on:
  schedule:
    # Monday 03:00 UTC — EU legislation updates are infrequent;
    # weekly cadence balances freshness with SPARQL endpoint courtesy
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Run EUR-Lex discovery
        run: npm run discover -- --dry-run
        continue-on-error: true
        id: discover

      - name: Upload discovery watermark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-legislation-watermark
          path: data/eu-legislation-watermark.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Create review issue if candidates found
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            try {
              const output = execSync('npm run discover -- --dry-run 2>&1', { encoding: 'utf-8' });
              const promotedMatch = output.match(/Auto-promoted.*?:\s*(\d+)/);
              const reviewMatch = output.match(/Review queue.*?:\s*(\d+)/);
              const promoted = promotedMatch ? parseInt(promotedMatch[1]) : 0;
              const review = reviewMatch ? parseInt(reviewMatch[1]) : 0;

              if (promoted === 0 && review === 0) {
                core.info('No new EU legislation candidates found this week.');
                return;
              }

              const title = `Weekly EUR-Lex Discovery: ${promoted} promoted, ${review} for review`;
              const body = [
                `## EUR-Lex Discovery Report — ${new Date().toISOString().split('T')[0]}`,
                '',
                `**Auto-promoted** (high confidence, score ≥ 15): **${promoted}**`,
                `**Review queue** (medium confidence, score ≥ 5): **${review}**`,
                '',
                '### Next Steps',
                '',
                '1. Review the promoted acts in the discovery output',
                '2. Add high-confidence acts to `packages/crawler/src/sources/eu-legislation/registry.ts`',
                '3. Verify CELEX IDs and titles against EUR-Lex',
                '4. Run `npm run discover` locally to confirm before merging',
                '',
                '### Discovery Output',
                '',
                '```',
                output,
                '```',
                '',
                '---',
                'This issue was auto-generated by the Weekly EUR-Lex Discovery workflow.',
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['discovery', 'eu-legislation', 'needs-review'],
              });

              core.info(`Created issue: ${title}`);
            } catch (error) {
              core.warning(`Discovery issue creation failed: ${error.message}`);
            }
